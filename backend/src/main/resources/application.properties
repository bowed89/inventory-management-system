spring.application.name=inventory.management.system

# Local, untracked overrides (copy application-local.properties.example -> application-local.properties)
spring.config.import=optional:classpath:application-local.properties

# MYSQL CONNECTION
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventory_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# LOGGING HIBERNATE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# MAXIMUM SIGN OF IMAGE
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

#SECRET KEYS
secretJwtString=${JWT_SECRET}